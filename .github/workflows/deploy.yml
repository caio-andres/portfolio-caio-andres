name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

# O job só lê o repositório; o acesso à VPS vem dos secrets.
permissions:
  contents: read

# Nunca dois deploys ao mesmo tempo: o mais novo espera o anterior terminar.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Next 16 pede Node >= 20.9. A VPS precisa de uma versão compatível (ver A-DECIDIR.md).
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Checks (lint, tipos, testes unitários)
        run: |
          npm run lint
          npm run typecheck
          npm test

      # O GITHUB_SHA vira o "build <sha>" do rodapé (ver next.config.ts).
      - name: Build Next.js app
        run: npm run build

      - name: Package build
        run: |
          tar -czf deploy.tar.gz \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.ts \
            node_modules

      - name: Deploy to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Extract and restart
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Iniciando deploy..."

            pm2 stop portfolio || true

            if [ -d /var/www/portfolio-caio-andres/.next ]; then
              echo "Fazendo backup do build anterior..."
              tar -czf ~/backups/backup-$(date +%Y%m%d%H%M%S).tar.gz \
                /var/www/portfolio-caio-andres/.next
            fi

            echo "Extraindo novo build..."
            cd /var/www/portfolio-caio-andres
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz

            echo "Reiniciando aplicação..."
            pm2 restart portfolio

            echo "Deploy feito! :D\n Status dos processos (através do PM2):"
            pm2 status
