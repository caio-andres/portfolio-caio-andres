name: CI

# Roda em todo PR (e sob demanda). Na main quem roda é o deploy.yml, que
# repete as checagens rápidas antes de publicar.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Commit novo no PR cancela o run anterior do mesmo PR.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Dependências de produção sem vulnerabilidade alta
        run: npm audit --omit=dev --audit-level=high

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (build de produção)
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
